<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#132A38">
    <title>Offline · Chakra Productions</title>

    <!--
        Served by the service worker when a navigation cannot reach the network.

        Deliberately self-contained: no stylesheet, no webfont, no script. It
        has to render from the cache alone, and the app's real CSS is a hashed
        filename that changes every deploy — depending on it would mean this
        page renders unstyled exactly when it is needed.
    -->
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #132A38;
            color: #fff;
            font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            line-height: 1.55;
        }
        .wrap { max-width: 380px; }
        .mark {
            width: 56px; height: 56px; margin: 0 auto 28px;
            border-radius: 50%;
            border: 1px solid #67BCD4;
            display: flex; align-items: center; justify-content: center;
        }
        .mark span { width: 16px; height: 16px; border-radius: 50%; background: #67BCD4; }
        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.015em; }
        p { margin: 12px 0 0; font-size: 15px; color: rgba(228, 242, 247, 0.7); }
        button {
            margin-top: 28px;
            min-height: 48px;
            padding: 0 26px;
            border: 0;
            border-radius: 8px;
            background: #67BCD4;
            color: #132A38;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
        }
        button:hover { background: #4FA9C4; }
        button:focus-visible { outline: 2px solid #8ACCE0; outline-offset: 2px; }
        .note { margin-top: 22px; font-size: 12px; color: rgba(228, 242, 247, 0.45); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="mark" aria-hidden="true"><span></span></div>

        <h1>You&rsquo;re offline</h1>
        <p>This page needs a connection. Anything you had already loaded is still open in the other tabs.</p>

        <button type="button" onclick="location.reload()">Try again</button>

        <p class="note">Chakra Productions</p>
    </div>
</body>
</html>
