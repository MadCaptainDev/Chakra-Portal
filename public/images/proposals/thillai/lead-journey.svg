<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#67BCD4"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F9FC"/><stop offset="1" stop-color="#E4F2F7"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4A5C"/><stop offset="1" stop-color="#132A38"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>

  <!-- decorative paws -->
  <g fill="#3D8CA6" opacity="0.07">
    <g transform="translate(1110 70) rotate(20)"><ellipse cx="0" cy="10" rx="16" ry="13"/><circle cx="-17" cy="-10" r="7"/><circle cx="-6" cy="-19" r="7"/><circle cx="7" cy="-19" r="7"/><circle cx="18" cy="-10" r="7"/></g>
    <g transform="translate(90 500) rotate(-18)"><ellipse cx="0" cy="10" rx="16" ry="13"/><circle cx="-17" cy="-10" r="7"/><circle cx="-6" cy="-19" r="7"/><circle cx="7" cy="-19" r="7"/><circle cx="18" cy="-10" r="7"/></g>
  </g>

  <text x="600" y="58" font-size="13" font-weight="600" fill="#3D8CA6" text-anchor="middle" letter-spacing="2">ONE PLACE FOR EVERY ENQUIRY, PET AND VISIT</text>

  <!-- sources -->
  <g>
    <rect x="60" y="110" width="250" height="84" rx="16" fill="#FFFFFF" stroke="#E4F2F7"/>
    <circle cx="106" cy="152" r="24" fill="#E4F2F7"/>
    <path d="M92 152 C92 142 101 142 106 152 C111 162 120 162 120 152 C120 142 111 142 106 152 C101 162 92 162 92 152 Z" fill="none" stroke="#3D8CA6" stroke-width="3.5"/>
    <text x="142" y="146" font-size="16" font-weight="700" fill="#111827">Meta Ads</text>
    <text x="142" y="168" font-size="12" fill="#6B7280">Facebook &amp; Instagram</text>

    <rect x="60" y="238" width="250" height="84" rx="16" fill="#FFFFFF" stroke="#E4F2F7"/>
    <circle cx="106" cy="280" r="24" fill="#FEF3C7"/>
    <rect x="97" y="265" width="18" height="30" rx="4" fill="none" stroke="#B45309" stroke-width="3"/>
    <line x1="103" y1="289" x2="109" y2="289" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
    <text x="142" y="274" font-size="16" font-weight="700" fill="#111827">Phone Calls</text>
    <text x="142" y="296" font-size="12" fill="#6B7280">Direct enquiries</text>

    <rect x="60" y="366" width="250" height="84" rx="16" fill="#FFFFFF" stroke="#E4F2F7"/>
    <circle cx="106" cy="408" r="24" fill="#E4F2F7"/>
    <path d="M106 422 C106 422 94 409 94 400 A12 12 0 0 1 118 400 C118 409 106 422 106 422 Z" fill="#284250"/>
    <circle cx="106" cy="400" r="4.5" fill="#FFFFFF"/>
    <text x="142" y="402" font-size="16" font-weight="700" fill="#111827">Google Maps</text>
    <text x="142" y="424" font-size="12" fill="#6B7280">Calls from the listing</text>
  </g>

  <!-- connectors in -->
  <g fill="none" stroke="#67BCD4" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)">
    <path d="M314 152 C360 152 370 240 420 262"/>
    <path d="M314 280 L420 280"/>
    <path d="M314 408 C360 408 370 320 420 298"/>
  </g>

  <!-- core -->
  <rect x="428" y="130" width="344" height="300" rx="22" fill="url(#core)"/>
  <circle cx="480" cy="182" r="24" fill="#3D8CA6"/>
  <g fill="#FFFFFF"><ellipse cx="480" cy="188" rx="8.5" ry="7"/><circle cx="470" cy="176" r="3.6"/><circle cx="476" cy="171" r="3.6"/><circle cx="484" cy="171" r="3.6"/><circle cx="490" cy="176" r="3.6"/></g>
  <text x="518" y="178" font-size="18" font-weight="700" fill="#FFFFFF">Thillai Pets CRM</text>
  <text x="518" y="198" font-size="12" fill="#8ACCE0">Admin · Sales · Grooming</text>

  <g font-size="13" font-weight="600">
    <rect x="456" y="226" width="288" height="42" rx="10" fill="#1E3A4A"/>
    <circle cx="480" cy="247" r="6" fill="#F59E0B"/>
    <text x="496" y="252" fill="#FFFFFF">Lead captured &amp; marked Hot</text>
    <rect x="456" y="278" width="288" height="42" rx="10" fill="#1E3A4A"/>
    <circle cx="480" cy="299" r="6" fill="#67BCD4"/>
    <text x="496" y="304" fill="#FFFFFF">Assigned to the sales team</text>
    <rect x="456" y="330" width="288" height="42" rx="10" fill="#1E3A4A"/>
    <circle cx="480" cy="351" r="6" fill="#34D399"/>
    <text x="496" y="356" fill="#FFFFFF">Follow-up reminder set</text>
  </g>
  <text x="600" y="404" font-size="11" fill="#8ACCE0" text-anchor="middle">No enquiry is lost in a notebook or a chat</text>

  <!-- connector out -->
  <g fill="none" stroke="#67BCD4" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)">
    <path d="M776 262 C820 240 830 152 882 152"/>
    <path d="M776 280 L882 280"/>
    <path d="M776 298 C820 320 830 408 882 408"/>
  </g>

  <!-- outcomes -->
  <g>
    <rect x="890" y="110" width="250" height="84" rx="16" fill="#FFFFFF" stroke="#DCFCE7"/>
    <circle cx="936" cy="152" r="24" fill="#DCFCE7"/>
    <path d="M925 152 L933 160 L948 144" fill="none" stroke="#15803D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="972" y="146" font-size="16" font-weight="700" fill="#111827">New Customer</text>
    <text x="972" y="168" font-size="12" fill="#6B7280">With every pet on file</text>

    <rect x="890" y="238" width="250" height="84" rx="16" fill="#FFFFFF" stroke="#E4F2F7"/>
    <circle cx="936" cy="280" r="24" fill="#E4F2F7"/>
    <rect x="922" y="268" width="28" height="26" rx="4" fill="none" stroke="#3D8CA6" stroke-width="3"/>
    <line x1="922" y1="276" x2="950" y2="276" stroke="#3D8CA6" stroke-width="3"/>
    <line x1="929" y1="263" x2="929" y2="271" stroke="#3D8CA6" stroke-width="3" stroke-linecap="round"/>
    <line x1="943" y1="263" x2="943" y2="271" stroke="#3D8CA6" stroke-width="3" stroke-linecap="round"/>
    <text x="972" y="274" font-size="16" font-weight="700" fill="#111827">Booked &amp; Groomed</text>
    <text x="972" y="296" font-size="12" fill="#6B7280">Groomer assigned</text>

    <rect x="890" y="366" width="250" height="84" rx="16" fill="#FFFFFF" stroke="#FEF3C7"/>
    <circle cx="936" cy="408" r="24" fill="#FEF3C7"/>
    <path d="M926 414 L926 404 A10 10 0 0 1 946 404 L946 414 L949 418 L923 418 Z" fill="#F59E0B"/>
    <circle cx="936" cy="421" r="3" fill="#F59E0B"/>
    <text x="972" y="402" font-size="16" font-weight="700" fill="#111827">Reminded to Return</text>
    <text x="972" y="424" font-size="12" fill="#6B7280">Staff alerted 7 days ahead</text>
  </g>

  <!-- return loop -->
  <path d="M1015 454 C1015 520 600 530 600 434" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 6" marker-end="url(#arrow)"/>
  <text x="808" y="520" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">…and they come back for their next visit</text>
</svg>
