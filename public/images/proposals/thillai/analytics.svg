<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="720" rx="24" fill="#EAF4F8"/>
  <rect x="46" y="48" width="1120" height="640" rx="18" fill="#132A38" opacity="0.08"/>
  <rect x="40" y="40" width="1120" height="640" rx="18" fill="#FFFFFF"/>
  <path d="M58 40h1084a18 18 0 0 1 18 18v26H40V58a18 18 0 0 1 18-18z" fill="#F3F4F6"/>
  <circle cx="66" cy="62" r="6" fill="#F87171"/><circle cx="86" cy="62" r="6" fill="#FBBF24"/><circle cx="106" cy="62" r="6" fill="#34D399"/>
  <rect x="440" y="52" width="320" height="20" rx="10" fill="#FFFFFF"/>
  <text x="600" y="66" font-size="11" fill="#9CA3AF" text-anchor="middle">Thillai Pets Clinic · Business Insights</text>

  <text x="72" y="128" font-size="22" font-weight="700" fill="#111827">Business Insights</text>
