    <text x="92" y="238" font-size="30" font-weight="700" fill="#2F6E84">38%</text>
    <text x="172" y="238" font-size="11" font-weight="600" fill="#15803D">+6 pts</text>

    <rect x="336" y="170" width="248" height="96" rx="12" fill="#F0FDF4" stroke="#DCFCE7"/>
