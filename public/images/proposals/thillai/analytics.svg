    <text x="356" y="238" font-size="30" font-weight="700" fill="#15803D">₹2.4L</text>
    <text x="454" y="238" font-size="11" font-weight="600" fill="#15803D">+12%</text>

    <rect x="600" y="170" width="248" height="96" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="620" y="196" font-size="12" fill="#6B7280">Customers who returned</text>
