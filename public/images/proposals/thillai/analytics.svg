    <text x="930" y="238" font-size="11" fill="#6B7280">reminders sent</text>
  </g>

  <!-- bar chart -->
  <rect x="72" y="284" width="560" height="372" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
