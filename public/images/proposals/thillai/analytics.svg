    <rect x="684" y="392" width="160" height="46" rx="8" fill="#2F6E84"/><text x="764" y="413">Contacted</text><text x="764" y="429" font-size="13" font-weight="700">96</text>
    <rect x="700" y="448" width="128" height="46" rx="8" fill="#3D8CA6"/><text x="764" y="469">Followed up</text><text x="764" y="485" font-size="13" font-weight="700">71</text>
    <rect x="716" y="504" width="96" height="46" rx="8" fill="#67BCD4"/><text x="764" y="525" fill="#132A38">Converted</text><text x="764" y="541" font-size="13" font-weight="700" fill="#132A38">46</text>
  </g>
  <text x="764" y="590" font-size="11" fill="#6B7280" text-anchor="middle">38% of leads became</text>
  <text x="764" y="606" font-size="11" fill="#6B7280" text-anchor="middle">paying customers</text>

  <!-- due list -->
  <rect x="896" y="284" width="232" height="372" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="916" y="314" font-size="14" font-weight="700" fill="#111827">Due in next 7 days</text>
  <g font-size="12">
    <rect x="912" y="330" width="200" height="54" rx="10" fill="#FFFBEB"/>
    <text x="926" y="352" font-weight="700" fill="#111827">Bruno</text><text x="926" y="370" font-size="10" fill="#6B7280">Full grooming · 5 Oct</text>
    <rect x="912" y="394" width="200" height="54" rx="10" fill="#F9FAFB"/>
    <text x="926" y="416" font-weight="700" fill="#111827">Max</text><text x="926" y="434" font-size="10" fill="#6B7280">Bath &amp; trim · 6 Oct</text>
    <rect x="912" y="458" width="200" height="54" rx="10" fill="#F9FAFB"/>
    <text x="926" y="480" font-weight="700" fill="#111827">Snowy</text><text x="926" y="498" font-size="10" fill="#6B7280">Tick treatment · 7 Oct</text>
    <rect x="912" y="522" width="200" height="54" rx="10" fill="#F9FAFB"/>
    <text x="926" y="544" font-weight="700" fill="#111827">Leo</text><text x="926" y="562" font-size="10" fill="#6B7280">De-shedding · 9 Oct</text>
