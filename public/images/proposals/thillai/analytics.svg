    <rect x="218" y="412" width="26" height="198" rx="4" fill="#ABDAE7"/><rect x="248" y="552" width="26" height="58" rx="4" fill="#3D8CA6"/>
    <rect x="296" y="420" width="26" height="190" rx="4" fill="#ABDAE7"/><rect x="326" y="540" width="26" height="70" rx="4" fill="#3D8CA6"/>
    <rect x="374" y="390" width="26" height="220" rx="4" fill="#ABDAE7"/><rect x="404" y="528" width="26" height="82" rx="4" fill="#3D8CA6"/>
    <rect x="452" y="376" width="26" height="234" rx="4" fill="#ABDAE7"/><rect x="482" y="516" width="26" height="94" rx="4" fill="#3D8CA6"/>
    <rect x="530" y="360" width="26" height="250" rx="4" fill="#ABDAE7"/><rect x="560" y="514" width="26" height="96" rx="4" fill="#3D8CA6"/>
